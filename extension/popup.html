<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --ok: #2e7d32; --ok-bg: #e8f5e9;
      --caution: #ed6c02; --caution-bg: #fff4e5;
      --warn: #c62828; --warn-bg: #fdecea;
      --ink: #1b1b1f; --muted: #6b7280; --line: #eceef2;
    }
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; color: var(--ink); background: #fff; }

    header { padding: 16px; color: #fff; display: flex; align-items: center; gap: 12px; }
    header.ok { background: var(--ok); }
    header.caution { background: var(--caution); }
    header.warn { background: var(--warn); }
    .badge { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.18);
             display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
    .verdict { font-size: 16px; font-weight: 650; }
    .sub { font-size: 12px; opacity: .92; margin-top: 1px; }

    .meter { height: 6px; background: var(--line); }
    .meter > span { display: block; height: 100%; }
    .meter.ok > span { background: var(--ok); }
    .meter.caution > span { background: var(--caution); }
    .meter.warn > span { background: var(--warn); }

    .reasons { padding: 6px 0; }
    .reason { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    .reason:last-child { border-bottom: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; }
    .dot.hi { background: var(--warn); } .dot.mid { background: var(--caution); } .dot.lo { background: var(--muted); }
    .reason .pts { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
    .none { padding: 18px 16px; color: var(--muted); }

    .trust-wrap { padding: 12px 16px; border-top: 1px solid var(--line); }
    .trust { width: 100%; padding: 9px 12px; font: inherit; font-weight: 600; color: var(--ink);
             background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
    .trust:hover { background: #f6f7f9; }

    footer { font-size: 11px; color: var(--muted); padding: 10px 16px; border-top: 1px solid var(--line);
             display: flex; align-items: center; gap: 6px; }
    .lock { font-size: 12px; }
  </style>
</head>
<body>
  <header id="head" class="ok">
    <div class="badge" id="face">✓</div>
    <div>
      <div class="verdict" id="title">Checking…</div>
      <div class="sub" id="score"></div>
    </div>
  </header>
  <div class="meter ok" id="meter"><span id="bar" style="width:0%"></span></div>
  <div class="reasons" id="reasons"></div>
  <div class="none" id="none" hidden>No phishing signals on this page.</div>
  <div class="trust-wrap" id="trust-wrap" hidden>
    <button class="trust" id="trust">Trust this site, stop warning me</button>
  </div>
  <footer><span class="lock">🔒</span> All checks run locally. Nothing about this page is sent anywhere.</footer>
  <script src="popup.js"></script>
</body>
</html>
